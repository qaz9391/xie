<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D導覽論壇 | VR Tour Forum</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/cafeteria_page.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
</head>

<body>

    <header class="page-header">
        <a href="home.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回導覽
        </a>
        <h1><i class="fas fa-vr-cardboard"></i> 3D導覽論壇</h1>
    </header>

    <div class="container">
        <!-- Forum Section -->
        <section class="forum-section">
            <div class="forum-title">
                <i class="fas fa-comments"></i> 3D導覽討論區
            </div>

            <p style="text-align: center; color: #666; margin-bottom: 30px;">
                分享您的3D導覽體驗、提出建議或是討論校園各個景點的特色！
            </p>

            <!-- Comment Form -->
            <div class="comment-form">
                <input type="text" id="commentUser" placeholder="暱稱 (選填)">
                <textarea id="commentContent" placeholder="分享您的3D導覽體驗、建議或心得..."></textarea>
                <button class="btn-submit" id="btnSubmitComment">
                    發送留言 <i class="fas fa-paper-plane"></i>
                </button>
            </div>

            <!-- Comment List -->
            <div id="commentList" class="comment-list">
                <!-- Comments will be loaded here -->
                <div style="text-align: center; color: #999;">尚未有留言，搶頭香！</div>
            </div>
        </section>
    </div>

    <!-- Debug Output -->
    <div id="debugConsole"
        style="display:none; padding:10px; background:#333; color:#0f0; font-family:monospace; margin:20px; border-radius:10px; font-size:12px;">
    </div>

    <!-- Scripts -->
    <script src="js/vr_forum.js"></script>
</body>

</html>
