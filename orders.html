<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單管理後台 | Order Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/orders.css">
</head>

<body>

    <div class="admin-container">
        <aside class="sidebar">
            <div class="brand">
                <i class="fas fa-utensils"></i>
                <span>餐廳管理系統</span>
            </div>
            <nav>
                <a href="#" class="active"><i class="fas fa-list-alt"></i> 訂單列表</a>
                <a href="home.html"><i class="fas fa-home"></i> 回前台首頁</a>
            </nav>
        </aside>

        <main class="content">
            <header>
                <h1>即時訂單看板</h1>
                <div class="header-actions">
                    <button class="btn-refresh" onclick="fetchOrders()">
                        <i class="fas fa-sync-alt"></i> 刷新資料
                    </button>
                    <div class="user-profile">Admin</div>
                </div>
            </header>

            <div class="stats-cards">
                <div class="card">
                    <h3>今日訂單</h3>
                    <div class="num" id="statTodayCount">0</div>
                </div>
                <div class="card">
                    <h3>待處理</h3>
                    <div class="num pending" id="statPending">0</div>
                </div>
                <div class="card">
                    <h3>今日營收</h3>
                    <div class="num" id="statRevenue">$0</div>
                </div>
            </div>

            <div class="table-container">
                <table class="order-table">
                    <thead>
                        <tr>
                            <th>訂單編號</th>
                            <th>時間</th>
                            <th>顧客</th>
                            <th>內容概要</th>
                            <th>金額</th>
                            <th>狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="orderList">
                        <!-- JS renders here -->
                        <tr>
                            <td colspan="7" class="loading-row">載入中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">訂單明細</h3>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="order-meta" id="modalMeta">
                    <!-- Date, Name, Email -->
                </div>
                <div class="order-items-list" id="modalItems">
                    <!-- Items -->
                </div>
                <div class="order-total" id="modalTotal">
                    Total: $0
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-close" onclick="closeModal()">關閉</button>
            </div>
        </div>
    </div>

    <!-- Supabase & Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/orders.js"></script>
</body>

</html>
