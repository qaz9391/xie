<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>資料庫連線測試</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }

        .success {
            color: #0f0;
        }

        .error {
            color: #f00;
        }

        .warning {
            color: #fa0;
        }

        pre {
            background: #000;
            padding: 10px;
            border: 1px solid #333;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
</head>

<body>
    <h1>🔍 Supabase 資料庫連線診斷工具</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.appendChild(div);
        }

        function logPre(title, data) {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${title}:</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
            output.appendChild(div);
        }

        async function runDiagnostics() {
            log('=== 開始診斷 ===', 'warning');

            // 1. 檢查 Supabase library
            log('1️⃣ 檢查 Supabase library...', 'warning');
            if (!window.supabase) {
                log('❌ Supabase library 未載入！CDN 可能被擋。', 'error');
                return;
            }
            log('✅ Supabase library 已載入', 'success');

            // 2. 檢查 CONFIG
            log('2️⃣ 檢查設定檔...', 'warning');
            if (!window.CONFIG) {
                log('❌ CONFIG 未載入！js/config.js 可能有問題。', 'error');
                return;
            }
            log('✅ CONFIG 已載入', 'success');
            logPre('CONFIG 內容', {
                url: window.CONFIG.SUPABASE_URL,
                key: window.CONFIG.SUPABASE_KEY ? '(已設定)' : '(未設定)'
            });

            // 3. 初始化 Supabase Client
            log('3️⃣ 初始化 Supabase Client...', 'warning');
            let supabase;
            try {
                supabase = window.supabase.createClient(
                    window.CONFIG.SUPABASE_URL,
                    window.CONFIG.SUPABASE_KEY
                );
                log('✅ Supabase Client 初始化成功', 'success');
            } catch (e) {
                log(`❌ 初始化失敗: ${e.message}`, 'error');
                return;
            }

            // 4. 測試連線 - 讀取 stores
            log('4️⃣ 測試讀取 stores 表格...', 'warning');
            try {
                const { data, error } = await supabase
                    .from('stores')
                    .select('*');

                if (error) {
                    log(`❌ 讀取失敗: ${error.message}`, 'error');
                    logPre('錯誤詳情', error);
                    return;
                }

                log(`✅ 成功讀取 ${data ? data.length : 0} 筆店家資料`, 'success');
                logPre('店家資料', data);

            } catch (e) {
                log(`❌ 發生例外: ${e.message}`, 'error');
                logPre('例外詳情', e);
            }

            // 5. 測試讀取 comments
            log('5️⃣ 測試讀取 comments 表格...', 'warning');
            try {
                const { data, error } = await supabase
                    .from('comments')
                    .select('*')
                    .limit(5);

                if (error) {
                    log(`❌ 讀取失敗: ${error.message}`, 'error');
                    logPre('錯誤詳情', error);
                } else {
                    log(`✅ 成功讀取 ${data ? data.length : 0} 筆留言`, 'success');
                    logPre('留言資料', data);
                }
            } catch (e) {
                log(`❌ 發生例外: ${e.message}`, 'error');
            }

            log('=== 診斷完成 ===', 'warning');
        }

        // 開始診斷
        runDiagnostics();
    </script>
</body>

</html>
