<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店家菜單 | Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/cafeteria_page.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
</head>

<body>

    <header class="page-header">
        <a href="cafeteria.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回店家列表
        </a>
        <h1 id="storeName">店家菜單</h1>
    </header>

    <div class="container">
        <!-- Store Info / Header Image -->
        <img id="storeImage" src="" alt="Store Image" class="menu-header-img" style="display:none;">
        <p id="storeDesc" style="text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1rem;"></p>

        <!-- Menu Categories Section -->
        <div id="menuContainer">
            <div class="loading-spinner" style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-3x" style="color: #00B894;"></i>
                <p>載入菜單中...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/menu.js?v=2"></script>
</body>

</html>
