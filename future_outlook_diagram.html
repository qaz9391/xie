<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專案未來展望圖 - 向量網頁版</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #2c3e50;
      
      --color-center: #ffeaa7; /* 鵝黃色 */
      --color-green: #a8e6cf;  /* 綠色 */
      --color-blue: #d4e5ff;   /* 藍色 */
      --color-red: #ffaaa6;    /* 紅色/珊瑚色 */
      --color-orange: #ffd3b6; /* 橙黃色 */
      
      --border-center: #fdcb6e;
      --border-green: #55efc4;
      --border-blue: #74b9ff;
      --border-red: #ff7675;
      --border-orange: #fab1a0;
      
      --shadow-color: rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 20px;
    }

    /* 頂部操作列 */
    .controls {
      position: absolute;
      top: 20px;
      display: flex;
      gap: 15px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #eee;
    }

    .btn {
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      background: #2c3e50;
      color: #fff;
      transition: all 0.3s;
    }

    .btn:hover {
      background: #1a252f;
      transform: translateY(-1px);
    }

    /* 心智圖畫布 */
    .diagram-container {
      position: relative;
      width: 900px;
      height: 520px;
      background: #ffffff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG 背景連線 */
    .svg-connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .connection-line {
      stroke-width: 3px;
      stroke-linecap: round;
      opacity: 0.8;
      filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.1));
    }

    /* 節點通用樣式 */
    .node {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .node:hover {
      transform: scale(1.03);
    }

    /* 中央圓形節點 */
    .center-node {
      width: 130px;
      height: 130px;
      background-color: var(--color-center);
      border: 2px solid var(--border-center);
      border-radius: 50%;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 1px;
      box-shadow: 5px 8px 16px var(--shadow-color);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .center-node:hover {
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 6px 10px 20px var(--shadow-color);
    }

    /* 周圍分支節點樣式 */
    .branch-node {
      width: 280px;
      padding: 16px 20px;
      border-radius: 50px; /* 藥丸形/圓角矩形 */
      box-shadow: 6px 10px 18px var(--shadow-color);
      border-width: 2px;
      border-style: solid;
      background: #fff;
    }

    .branch-title {
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .branch-desc {
      font-size: 0.82rem;
      line-height: 1.4;
      opacity: 0.85;
      font-weight: 400;
    }

    /* 分支位置與特有色彩 */
    /* 1. 左上：綠色 */
    .node-top-left {
      top: 10%;
      left: 5%;
      background-color: var(--color-green);
      border-color: var(--border-green);
    }
    .node-top-left .branch-title { color: #1e7e34; }

    /* 2. 右上：藍色 */
    .node-top-right {
      top: 10%;
      right: 5%;
      background-color: var(--color-blue);
      border-color: var(--border-blue);
    }
    .node-top-right .branch-title { color: #0056b3; }

    /* 3. 左下：紅色/珊瑚色 */
    .node-bottom-left {
      bottom: 10%;
      left: 5%;
      background-color: var(--color-red);
      border-color: var(--border-red);
    }
    .node-bottom-left .branch-title { color: #c0392b; }

    /* 4. 右下：橙黃色 */
    .node-bottom-right {
      bottom: 10%;
      right: 5%;
      background-color: var(--color-orange);
      border-color: var(--border-orange);
    }
    .node-bottom-right .branch-title { color: #d35400; }

    /* 說明提示 */
    .tips {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #7f8c8d;
      text-align: center;
      background: #f8f9fa;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px dashed #ddd;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="window.history.back()">返回專案首頁</button>
    <button class="btn" onclick="toggleStyle()">切換圓角外觀</button>
    <button class="btn" onclick="window.print()">列印 / 另存 PDF</button>
  </div>

  <div class="diagram-container" id="diagram">
    <!-- SVG 連線 -->
    <svg class="svg-connections" id="svgCanvas">
      <line class="connection-line" id="line-tl" stroke="#55efc4" />
      <line class="connection-line" id="line-tr" stroke="#74b9ff" />
      <line class="connection-line" id="line-bl" stroke="#ff7675" />
      <line class="connection-line" id="line-br" stroke="#fab1a0" />
    </svg>

    <!-- 中央節點 -->
    <div class="node center-node" id="centerNode">
      未來展望
    </div>

    <!-- 左上節點 -->
    <div class="node branch-node node-top-left" id="node-tl">
      <div class="branch-title">室內地圖與路徑規劃</div>
      <div class="branch-desc">導入室內3D地標與箭頭引導，並透過路徑演算法為使用者規劃最短導覽路線。</div>
    </div>

    <!-- 右上節點 -->
    <div class="node branch-node node-top-right" id="node-tr">
      <div class="branch-title">智慧推薦與營運分析</div>
      <div class="branch-desc">分析學生的點餐偏好以提供熱門餐點推薦，並協助商家進行備料分析。</div>
    </div>

    <!-- 左下節點 -->
    <div class="node branch-node node-bottom-left" id="node-bl">
      <div class="branch-title">物聯網點餐與支付</div>
      <div class="branch-desc">整合實體餐廳POS機與出單印表機，並串接LINE Pay等行動支付API。</div>
    </div>

    <!-- 右下節點 -->
    <div class="node branch-node node-bottom-right" id="node-br">
      <div class="branch-title">跨校整合與資源共享</div>
      <div class="branch-desc">串接周邊商圈及其他學校的虛擬導覽系統，推動資源共享以打造智慧平台。</div>
    </div>
  </div>

  <div class="tips">
    💡 提示：您可以使用 Windows 快速鍵 <b>Win + Shift + S</b> 進行截圖，直接貼入您的 Word 報告或 PPT 簡報中！
  </div>

  <script>
    // 動態計算並繪製連線
    function drawLines() {
      const center = document.getElementById('centerNode');
      const tl = document.getElementById('node-tl');
      const tr = document.getElementById('node-tr');
      const bl = document.getElementById('node-bl');
      const br = document.getElementById('node-br');

      const container = document.getElementById('diagram').getBoundingClientRect();
      const centerRect = center.getBoundingClientRect();
      
      const cx = (centerRect.left + centerRect.width / 2) - container.left;
      const cy = (centerRect.top + centerRect.height / 2) - container.top;

      connectNode(tl, 'line-tl', cx, cy, container);
      connectNode(tr, 'line-tr', cx, cy, container);
      connectNode(bl, 'line-bl', cx, cy, container);
      connectNode(br, 'line-br', cx, cy, container);
    }

    function connectNode(targetNode, lineId, cx, cy, containerRect) {
      const targetRect = targetNode.getBoundingClientRect();
      const line = document.getElementById(lineId);
      
      // 計算目標節點的邊緣中點，使連線指向邊緣而非中心
      const tx = (targetRect.left + targetRect.width / 2) - containerRect.left;
      const ty = (targetRect.top + targetRect.height / 2) - containerRect.top;

      line.setAttribute('x1', cx);
      line.setAttribute('y1', cy);
      line.setAttribute('x2', tx);
      line.setAttribute('y2', ty);
    }

    // 切換為類似使用者參考圖的膠囊圓角或標準圓角矩形
    let isCapsule = true;
    function toggleStyle() {
      const nodes = document.querySelectorAll('.branch-node');
      nodes.forEach(node => {
        if (isCapsule) {
          node.style.borderRadius = '16px';
        } else {
          node.style.borderRadius = '50px';
        }
      });
      isCapsule = !isCapsule;
      setTimeout(drawLines, 50); // 重新計算線條
    }

    // 監聽載入與縮放事件
    window.addEventListener('load', drawLines);
    window.addEventListener('resize', drawLines);
    
    // 增加懸停連線加粗特效
    function setupHoverEffects() {
      const links = [
        { node: 'node-tl', line: 'line-tl' },
        { node: 'node-tr', line: 'line-tr' },
        { node: 'node-bl', line: 'line-bl' },
        { node: 'node-br', line: 'line-br' }
      ];
      links.forEach(item => {
        const el = document.getElementById(item.node);
        const ln = document.getElementById(item.line);
        el.addEventListener('mouseenter', () => {
          ln.style.strokeWidth = '6px';
          ln.style.opacity = '1';
        });
        el.addEventListener('mouseleave', () => {
          ln.style.strokeWidth = '3px';
          ln.style.opacity = '0.8';
        });
      });
    }
    
    window.addEventListener('DOMContentLoaded', setupHoverEffects);
  </script>
</body>
</html>
